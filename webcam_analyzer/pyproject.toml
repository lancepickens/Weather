[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webcam-analyzer"
version = "0.1.0"
description = "Cloud-cover ground truth from AlertCalifornia webcam frames via star detection"
requires-python = ">=3.11"
dependencies = [
    "astropy>=6.0",
    "photutils>=1.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10.0",
]

[project.scripts]
webcam-calibrate = "webcam_analyzer.calibrate:main"
webcam-analyze = "webcam_analyzer.analyze:main"
webcam-fetch = "webcam_analyzer.fetch:main"

[tool.hatch.build.targets.wheel]
packages = ["webcam_analyzer"]
